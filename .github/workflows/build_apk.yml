name: Build AlertX APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python 3.11 ──────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── 3. System dependencies ─────────────────────────────────────────
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git zip unzip \
            openjdk-17-jdk \
            python3-pip python3-dev \
            build-essential ccache \
            libncurses5 libstdc++6 \
            libssl-dev libffi-dev \
            zlib1g-dev autoconf libtool \
            libltdl-dev pkg-config cmake ninja-build \
            libsdl2-dev libsdl2-image-dev \
            libsdl2-mixer-dev libsdl2-ttf-dev \
            ffmpeg lld

          # Set Java 17 as default
          sudo update-alternatives --set java \
            /usr/lib/jvm/java-17-openjdk-amd64/bin/java || true

      # ── 4. Set up Android SDK via sdkmanager (reliable method) ─────────
      - name: Set up Android SDK
        run: |
          # Use the pre-installed Android SDK on GitHub runners
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

          # Install required SDK components
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;25.2.9519653" 2>/dev/null || true

          # Verify build-tools installed
          ls $ANDROID_SDK_ROOT/build-tools/ || echo "build-tools dir missing"

          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV

      # ── 5. Accept Android SDK licenses ─────────────────────────────────
      - name: Accept Android SDK licenses
        run: |
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      # ── 6. Cache Buildozer directory ────────────────────────────────────
      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            android/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('android/buildozer.spec') }}-v2
          restore-keys: |
            buildozer-${{ runner.os }}-

      # ── 7. Cache pip ────────────────────────────────────────────────────
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('**/requirements*.txt') }}

      # ── 8. Install Buildozer ────────────────────────────────────────────
      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip wheel setuptools
          pip install Cython==0.29.36
          pip install buildozer

      # ── 9. Configure Buildozer to use pre-installed SDK/NDK ────────────
      - name: Configure Buildozer SDK paths
        working-directory: android
        run: |
          # Tell buildozer where to find the pre-installed SDK
          mkdir -p ~/.buildozer/android/platform
          ln -sfn $ANDROID_HOME \
            ~/.buildozer/android/platform/android-sdk || true

          # Patch buildozer.spec to use system SDK
          # (buildozer will use its own download if not already present)
          echo "android.sdk_path = $ANDROID_HOME" >> buildozer.spec
          echo "android.ndk_path = $ANDROID_HOME/ndk/25.2.9519653" >> buildozer.spec
          echo "android.build_tools_version = 34.0.0" >> buildozer.spec

      # ── 10. Build debug APK ─────────────────────────────────────────────
      - name: Build AlertX debug APK
        working-directory: android
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          # Suppress interactive prompts
          BUILDOZER_WARN_ON_ROOT: "0"
        run: |
          # Accept licenses non-interactively
          yes | buildozer android debug 2>&1 | tee build.log
          echo "--- Build step completed ---"
          ls -lh bin/ 2>/dev/null || echo "WARNING: No bin/ directory — build may have failed"

      # ── 11. Upload APK artifact ─────────────────────────────────────────
      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: alertx-debug-apk
          path: android/bin/*.apk
          if-no-files-found: error
          retention-days: 30

      # ── 12. Upload build log (always, for debugging) ────────────────────
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: android/build.log
          if-no-files-found: ignore
          retention-days: 7

  # ── Create GitHub Release with the APK ──────────────────────────────────
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-22.04
    needs: build-apk
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: alertx-debug-apk
          path: ./release-assets

      - name: List release assets
        run: ls -lh ./release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0-build-${{ github.run_number }}
          name: "AlertX v2.0.0 — Build #${{ github.run_number }}"
          body: |
            ## AlertX Android APK — Build #${{ github.run_number }}

            **Commit**: `${{ github.sha }}`  
            **Branch**: `${{ github.ref_name }}`

            ### Installation
            1. Download the `.apk` file below
            2. Transfer it to your Android device
            3. Enable **Install from Unknown Sources** → Settings → Security
            4. Tap the APK to install

            ### Features
            - ✅ Instant 1-tap SOS (zero countdown)
            - ✅ 5-tap rapid SOS detector
            - ✅ Live GPS location sharing with secure tracking link
            - ✅ Priority-tiered emergency contacts (auto-call + SMS)
            - ✅ Safety timer with auto-SOS escalation
            - ✅ Emergency guides: CPR, Earthquake, Fire, First Aid, Flood, Heimlich
            - ✅ Evidence vault (audio recording + photo)
            - ✅ Community incident reporting with offline queue
            - ✅ Fake call escape tool
            - ✅ Nearby emergency services quick-dial (Police 100, Fire 101, Ambulance 108)
            - ✅ Medical profile for emergency responders
          files: ./release-assets/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
