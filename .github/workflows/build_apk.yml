name: Build AlertX APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ── Job 1: Build APK using Buildozer Docker image ────────────────────────
  build-apk:
    name: Build Android APK (Docker)
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Cache Buildozer's own internal SDK/NDK downloads
      - name: Cache Buildozer directory
        uses: actions/cache@v4
        with:
          path: android/.buildozer
          key: buildozer-docker-${{ runner.os }}-${{ hashFiles('android/buildozer.spec') }}-v3
          restore-keys: |
            buildozer-docker-${{ runner.os }}-

      # Build APK inside the official kivy/buildozer Docker container
      # This image ships with Python, NDK, SDK, build-tools all pre-installed
      - name: Build APK via Buildozer Docker
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          command: buildozer android debug
          workdir: android
          buildozer_version: stable

      # Upload the produced APK
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: alertx-debug-apk
          path: ${{ steps.buildozer.outputs.filename }}
          if-no-files-found: error
          retention-days: 30

  # ── Job 2: Create GitHub Release with the APK ────────────────────────────
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-22.04
    needs: build-apk
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: alertx-debug-apk
          path: ./release-assets

      - name: List release assets
        run: ls -lh ./release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0-build-${{ github.run_number }}
          name: "AlertX v2.0.0 — Build #${{ github.run_number }}"
          body: |
            ## AlertX Android APK — Build #${{ github.run_number }}

            **Commit**: `${{ github.sha }}`
            **Branch**: `${{ github.ref_name }}`

            ### Installation
            1. Download the `.apk` file attached below
            2. Transfer it to your Android device
            3. Enable **Install from Unknown Sources** → Settings → Security
            4. Tap the APK to install

            ### Features in this build
            - ✅ Instant 1-tap SOS (zero countdown)
            - ✅ 5-tap rapid SOS detector (anywhere in the app)
            - ✅ Live GPS location sharing (secure token link)
            - ✅ Priority-tiered emergency contacts (auto-call + SMS broadcast)
            - ✅ Safety timer with auto-SOS escalation
            - ✅ Emergency guides: CPR, Earthquake, Fire RACE, First Aid, Flood, Heimlich
            - ✅ Evidence vault (audio + photo)
            - ✅ Community incident reporting with offline queue
            - ✅ Fake call escape tool
            - ✅ Nearby emergency services (Police 100, Fire 101, Ambulance 108)
            - ✅ Medical profile for emergency responders
          files: ./release-assets/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
